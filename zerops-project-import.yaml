#zeropsPreprocessor=on
project:
    name: export-probe-demo
    envVariables:
        APP_DEBUG: "false"
        APP_ENV: production
        APP_KEY: <@generateRandomString(32, true, false)>
        GIT_TOKEN: <@pickRandom(["REPLACE_ME"])>
services:
    - buildFromGit: https://github.com/krls2020/eval1.git
      enableSubdomainAccess: true
      hostname: probeapp
      mode: NON_HA
      type: php-apache@8.4
      zeropsSetup: probeapp
    - hostname: probedb
      mode: NON_HA
      priority: 10
      type: postgresql@16

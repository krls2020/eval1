zerops:
  - setup: probeapp
    build:
      base: php@8.4
      buildCommands:
        - composer install --no-dev --optimize-autoloader 2>/dev/null || true
      deployFiles: ['./']
    run:
      base: php-apache@8.4
      ports:
        - port: 80
          httpSupport: true
      envVariables:
        APP_ENV: ${APP_ENV}
        APP_DEBUG: ${APP_DEBUG}
        APP_KEY: ${APP_KEY}
        DB_HOST: ${probedb_hostname}
        DB_USER: ${probedb_user}
        DB_PASSWORD: ${probedb_password}
        DB_DATABASE: ${probedb_dbName}
  # Development pool: each branch gets one container of it, with the
  # repository checked out and a dev server the Mate's preview pane reaches.
  - setup: probeapppool
    build:
      base: php@8.4
      os: ubuntu
      deployFiles: ./
    run:
      base: php-apache@8.4
      os: ubuntu
      ports:
        - port: 8001
          httpSupport: true
        - port: 8002
          httpSupport: true
        - port: 8003
          httpSupport: true
        - port: 8004
          httpSupport: true
        - port: 8005
          httpSupport: true
        - port: 8006
          httpSupport: true
        - port: 8007
          httpSupport: true
        - port: 8008
          httpSupport: true
        - port: 8009
          httpSupport: true
        - port: 8010
          httpSupport: true
      envVariables:
        APP_ENV: local
        APP_DEBUG: "true"
        DB_HOST: ${probedb_hostname}
        DB_USER: ${probedb_user}
        DB_PASSWORD: ${probedb_password}
        DB_DATABASE: ${probedb_dbName}
      prepareCommands:
        - sudo sh -c 'u=https://github.com/zeropsio/zcp/releases/latest/download/zcp-devsup-linux-amd64; f=/usr/local/bin/zcp-devsup; if command -v curl >/dev/null; then curl -fsSL "$u" -o "$f"; else wget -qO "$f" "$u"; fi && chmod 0755 "$f"'
      # php-apache runs start as root; the supervisor runs as zerops, where
      # zcp's dev-server tools reach it (~/.zcp/devsup), with the start's env.
      start: runuser -u zerops -- zcp-devsup run
